[package]
name = "lending-contracts"
version = "0.1.0"
edition = "2024"
description = "Simplicity Lending contract"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockstreamResearch/simplicity-lending"
readme = "README.md"
keywords = ["simplicity", "lending", "wharfedale", "bitcoin", "elements", "contracts"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = ["asset_auth", "script_auth", "lending", "pre_lock"]
asset_auth = []
script_auth = []
lending = []
pre_lock = []

[lints]
workspace = true

[dependencies]
hex = { workspace = true }
thiserror = { workspace = true }
serde_json = "1"
rand = "0.8.5"

lending-sdk = { path = "../sdk", default-features = false }

[dev-dependencies]
anyhow = "1"
lending-sdk = { path = "../sdk", features = ["testing"] }
