[package]
name = "lending-sdk"
version = "0.1.0"
edition = "2024"
description = "Wharfedale transaction layer for the lending protocol: Simplicity programs with storage leaves, transaction assembly, a wallet signer, and an in-process test chain"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["node"]
# The node provider (a Wharfedale node's RPC and Esplora API, over HTTP).
node = ["dep:wharfedale-sdk"]
# In-process chain validated by Wharfedale's consensus code, for tests.
testing = ["dep:wharfedale-ledger"]

[lints]
workspace = true

[dev-dependencies]
wharfedale-sdk = { path = "../../../wharfedale-sdk-rs" }

[dependencies]
bip39 = "=2.2.2"
either = "1"
elements = "0.27.0"
hex = { workspace = true }
rand = "0.8.5"
serde_json = "1"
simplicity-lang = { version = "0.9.0", features = ["elements"] }
simplicityhl = "0.9.0"
thiserror = { workspace = true }

# Sibling checkouts, as for the node (see README).
wharfedale-sdk = { path = "../../../wharfedale-sdk-rs", optional = true }
wharfedale-ledger = { path = "../../../wharfedale/crates/ledger", optional = true }
