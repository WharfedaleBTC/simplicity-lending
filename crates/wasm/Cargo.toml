[package]
name = "lending-wasm"
version = "0.1.0"
edition = "2024"
description = "The lending protocol's Wharfedale transaction layer for the browser: program addresses, wallet keys, unblinding, and completing (funding, blinding, signing, satisfying) transactions"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
bip39 = "=2.2.2"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8.5"
hex = { workspace = true }
lending-sdk = { path = "../sdk", default-features = false }
serde = { workspace = true }
serde_json = "1"
# Must match the wasm-bindgen CLI that generates the JavaScript bindings (docker/wasm.Dockerfile).
wasm-bindgen = "=0.2.100"
