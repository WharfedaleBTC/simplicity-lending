[workspace]
resolver = "3"
members = [
    "crates/*"
]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.lints.clippy]
multiple_crate_versions = "allow"

[workspace.dependencies]
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"]}
thiserror = { version = "2.0.18" }
tracing = { version = "0.1.41" }

# The browser module (crates/wasm): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
